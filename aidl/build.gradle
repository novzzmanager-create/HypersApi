plugins {
    id('com.android.library')
}

android {
    namespace 'hypers.manager.aidl'
    buildFeatures {
        buildConfig false
        aidl true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

ext {
    publishLibrary = true
    POM_NAME = "Hypers API - aidl"
    POM_DESCRIPTION = "Low level aidl of Hypers and Sui."
}
